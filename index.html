<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFD700" />
    <meta name="msapplication-TileColor" content="#FFD700" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#FFD700" />

    <!-- SEO Meta Tags -->
    <title>Taxi GO | Best Taxi Service in Udaipur | 24/7 Airport Transfer &amp; Local Rides</title>
    <meta name="description" content="Book the most reliable and affordable taxi service in Udaipur. Taxi GO offers 24/7 airport transfers, local sightseeing, and outstation trips with professional drivers and premium vehicles." />
    <meta name="keywords" content="taxi service udaipur, car rental udaipur, airport transfer udaipur, sightseeing udaipur, best cab service, affordable taxi, professional drivers" />
    <meta name="author" content="Taxi GO" />

    <!-- Structured JSON-LD Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "TaxiService",
            "@id": "https://taxigo-udaipur.com/#service",
            "name": "Taxi GO Udaipur",
            "description": "Book the most reliable and affordable taxi service in Udaipur. Taxi GO offers 24/7 airport transfers, local sightseeing, and outstation trips.",
            "provider": {
              "@type": "LocalBusiness",
              "@id": "https://taxigo-udaipur.com/#organization",
              "name": "Taxi GO",
              "image": "https://taxigo-udaipur.com/logo.png",
              "telephone": "+919876543210",
              "email": "support@taxigo.com",
              "address": {
                "@type": "PostalAddress",
                "streetAddress": "Main Hub, City Center",
                "addressLocality": "Udaipur",
                "addressRegion": "Rajasthan",
                "postalCode": "313001",
                "addressCountry": "IN"
              },
              "priceRange": "$$"
            },
            "areaServed": {
              "@type": "AdministrativeArea",
              "name": "Udaipur"
            },
            "offers": {
              "@type": "Offer",
              "priceCurrency": "INR",
              "price": "8.00",
              "description": "Starting from ₹8 per kilometer"
            }
          }
        ]
      }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taxigo-udaipur.com/" />
    <meta property="og:title" content="Taxi GO | Premium Taxi Service in Udaipur" />
    <meta property="og:description" content="Experience safe, comfortable, and punctual taxi services in Udaipur. Book your ride today!" />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://taxigo-udaipur.com/" />
    <meta property="twitter:title" content="Taxi GO | Premium Taxi Service in Udaipur" />
    <meta property="twitter:description" content="Experience safe, comfortable, and punctual taxi services in Udaipur. Book your ride today!" />
    <meta property="twitter:image" content="/logo.png" />

    <!-- =====================================================
         PERFORMANCE: Resource Hints
         ===================================================== -->

    <!-- Preconnect to Google Fonts origins (eliminates connection latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch for image CDNs used across the site -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://www.transparenttextures.com" />
    <link rel="dns-prefetch" href="https://grainy-gradients.vercel.app" />

    <!-- Load Google Fonts via <link> (faster than CSS @import) with display=swap -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
